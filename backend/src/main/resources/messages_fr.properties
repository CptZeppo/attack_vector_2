# --- speed up reset timer ---
speed-up-reset-timer.name=Inconvénient : accélérer le compte à rebours de réinitialisation
speed-up-reset-timer.description-gm=Inconvénient : Lors de l'exécution de ce script, un compte à rebours existant \n\
  (déclenché par l'effet « Démarrer le compte à rebours de réinitialisation ») est accéléré. Cela empêche les joueurs d'exécuter plusieurs \n\
  instances de l'effet « Démarrer le compte à rebours de réinitialisation » sans aucune conséquence. \n\
  PS : veillez à toujours définir la durée de cet effet à une valeur supérieure à celle nécessaire pour déclencher la réinitialisation, sinon cet effet s'appliquera dès la première exécution du script.
speed-up-reset-timer.description-player=Si un compte à rebours de réinitialisation a déjà été déclenché par un autre script, celui-ci est accéléré par {0}.


