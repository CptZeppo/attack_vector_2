#HELP
command.help.outside="Vous êtes a l'extérieur du site.\n\
 D'ici vous pouvez observer le site pour planifier votre attaque. Cliquer sur un noeud de la carte pour voir les couches qu'il contient.\n\
  \n\
  Il n'y a que quelques commandes qui peuvent être utilisées depuis l'extérieur :\n\"
command.help.outside.scan="[b]scan[/]\n\
  Scanner le site pour révéler les noeuds. Le scan est bloqué par les noeuds protégés par une ICE.\n\
  C'est habituellement la première chose à faire en arrivant dans un nouveau site, pour rassembler des informations a son sujet.\n\"
command.help.outside.attack="[b]attack\n\
  Entrer dans le site et commencer l'attaque...\n\"
command.help.outside.dev="\n\
  [i]Disponible uniquement pour le development et le test :[/]\n\
   [b]quickscan[/] ou [b]qs\n\
   [b]quickattack[/] ou [b]qa\n\"
command.help.inside="Vous êtes a l'intérieur du site.\n\
  \n\
  Voici les commandes les plus courrantes que vous pouvez utiliser:\n\
  \n\
  [b]view\n\
  Permet d'afficher les couches du noeud dans lequel vous êtes. Vous pouvez aussi cliquer sur un noeud de la carte.\n\
  \n\
  [b]move[/] [ok]<id réseau>[/]     -- par exemple: [b]move[ok] 01\n\
  Permet de se déplacer vers un noeud adjacent.\n\
  \n\
  [b]hack[/] [primary]<couche>[/]          -- par exemple: [b]hack[primary] 1\n\
  Permet d'hacker une couche, par exemple une couche ICE ou une base de donnée.\n\
  C'est la principale manière d'intéragir avec les couches, cela fonctionne sur presque tous les types de couches\n\
  \n\
  \n\
  Les commandes suivantes ne sont utilisées qu'occasionnellement :\n\"
command.help.inside.scan="[b]scan[/]\n\
  Permet de scanner pour afficher de nouveaux noeud une fois qu'une ICE a été piratée.\n\"
command.help.inside.script="[b]run[/] [primary]<code du script>[/]      -- par exemple: [b]run [primary]1234-abcd\n\
  Permet d'exécuter un script que vous que vous avez chargé en mémoire.\n\"
command.help.inside.weaken="[b]weaken[/] [primary]<couche>[/]      -- par exemple: [b]weaken [primary]1\n\
  Permet de réduire la puissance d'une couche ICE.\n\
  \n\
  [b]weaken\n\
  Permet d'afficher le nombre d'utilisations restantes.\n\"
command.help.inside.undoTripwire="[b]rollback[/]\n\
  Permet de revenir au noeud précédent et d'annuler tous les comptes à rebours que vous avez déclanché en entrant dans le noeud actuel. \n\
  Ne fonctionne pas si vous n'avez déclanché aucun compte à rebours dans le noeud actuel.\n\"
command.help.inside.jumpToHacker="[b]jump[/] [info]<nom d'utilisateur> -- par exemple: [b]jump [info]angler\n\
  Permet de sauter vers le noeud d'un autre hacker. Les ICEs ne bloques pas ce mouvement.\n\"
command.help.inside.passwordAndDC="[b]password[/] [primary]<couche>[/]      -- par exemple: [b]password[primary] 1\n\
  Permet d'ouvrir l'interface de mot de passe de l'ICE et d'y insérer le mot de passe.\n\
  \n\
  [b]dc\n\
  Permet de vous deconnecter du site, stoppant votre attaque. Voud pouvez également cliquer sur 'Home' dans menu en bas.\n\"
command.help.inside.share="[b]/share[/] [info]<nom d'utilisateur>[/] (possible de mettre pliseurs nom)\n\
  Permet de partager votre essaie avec un ou plusieurs hackers pour qu'il vous rejoingnes.\n\"
command.help.inside.dowloadScipt="[b]/download-script[/] [primary]<code du script>[/] - télécharge un script.\n\
  Permet de télécharger un script d'un autre hacker vous a offert, ou que vous avez acheté a quelqu'un.\n\"
command.help.inside.help="Pour les informations sur les raccourcis, taper : [b]help[/] [b]shortcuts[/]\n\"
command.help.inside.shortcuts="Raccourcis du terminal :\n\
  \n\
  Fleche haut ou bas: permet de faire défiler dans les commandes précédentes.\n\
  Ctrl-L: permet de vider le terminal.\n\"
