#HELP
command.help.outside="You are outside of the site.\n\
  Here you can examine the site before entering to plan your attack. Click on a node in the map to see what layers it contains.\n\
  \n\
  There are only a few commands you can use when outside:\n\"
command.help.outside.scan="[b]scan[/]\n\
  Scan the site to reveal nodes. Does not scan beyond ICE nodes.\n\
  This is usually the first thing you do when you arrive at a new site, to gain information about it.\n\"
command.help.outside.attack="[b]attack\n\
  Enter the site and start the attack..\n\"
command.help.outside.dev="\n\
  [i]Available only during development and testing:[/]\n\
   [b]quickscan[/] or [b]qs\n\
   [b]quickattack[/] or [b]qa\n\"
command.help.inside="You are inside the site.\n\
  \n\
  These are the most common commands you will use:\n\
  \n\
  [b]view\n\
  Shows the current layers in the node you are in. You can also click on a node on the map.\n\
  \n\
  [b]move[/] [ok]<network id>[/]     -- for example: [b]move[ok] 01\n\
  Move to an adjacent node.\n\
  \n\
  [b]hack[/] [primary]<layer>[/]          -- for example: [b]hack[primary] 1\n\
  Use this to hack a layer, for example an ICE layer or a database.\n\
  This is the primary way to interact with layers, works on almost all layers.\n\
  \n\
  \n\
  These commands are only used occasionally:\n\"
command.help.inside.scan="[b]scan[/]\n\
  Scan to reveal new nodes once ICE has been hacked.\n\"
command.help.inside.script="[b]run[/] [primary]<script code>[/]      -- for example: [b]run [primary]1234-abcd\n\
  Run a script that you have loaded in memory.\n\"
command.help.inside.weaken="[b]weaken[/] [primary]<layer>[/]      -- for example: [b]weaken [primary]1\n\
  Reduce the strength of the ICE layer.\n\
  \n\
  [b]weaken\n\
  Show how many uses of weaken you have left.\n\"
command.help.inside.undoTripwire="[b]rollback[/]\n\
  Move back to the previous node and cancel all timers you started by entering the current node. \n\
  Does not work if you did not start any timers in the current node.\n\"
command.help.inside.jumpToHacker="[b]jump[/] [info]<user name> -- for example: [b]jump [info]angler\n\
  Jump to the node of another hacker. Ice does not block this movement.\n\"
command.help.inside.passwordAndDC="[b]password[/] [primary]<layer>[/]      -- for example: [b]password[primary] 1\n\
  Opens the password interface for ICE, to provide a password.\n\
  \n\
  [b]dc\n\
  Disconnect from the site, stop your attack. You can also click on 'Home' in the menu at the bottom.\n\"
command.help.inside.share="[b]/share[/] [info]<user name>[/] (optionally more usernames)\n\
  Share your run with one or more hackers so they can join you.\n\"
command.help.inside.dowloadScipt="[b]/download-script[/] [primary]<script code>[/] - download a script.\n\
  You can download a script from another hacker who has offered it, or you can buy it from someone.\n\"
command.help.inside.help="For information on shortcuts, type: [b]help[/] [b]shortcuts[/]\n\"
command.help.inside.shortcuts="Terminal shortcuts:\n\
