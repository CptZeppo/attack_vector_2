# --- help text (each block is one value; lines separated by \n, no MessageFormat args) ---
help.outside.intro = Jsi mimo síť.\n\
Tady si můžeš síť prohlédnout před vstupem a naplánovat útok. Klikni na uzel v mapě a uvidíš, jaké vrstvy obsahuje.\n\
\n\
Mimo síť můžeš použít jen pár příkazů:\n
help.outside.scan = [b]scan[/]\n\
Proskenuje síť a odhalí uzly. Neskenuje za ICE uzly.\n\
Tohle obvykle uděláš jako první po příchodu na novou síť, abys o ní získal informace.\n
help.outside.attack = [b]attack\n\
Vstoupí do sítě a zahájí útok..\n
help.outside.dev = \n\
[i]Dostupné jen během vývoje a testování:[/]\n\
 [b]quickscan[/] nebo [b]qs\n\
 [b]quickattack[/] nebo [b]qa\n
help.inside.intro = Jsi uvnitř sítě.\n\
\n\
Tohle jsou nejčastější příkazy, které budeš používat:\n\
\n\
[b]view\n\
Zobrazí vrstvy uzlu, ve kterém jsi. Můžeš také kliknout na uzel v mapě.\n\
\n\
[b]move[/] [ok]<network id>[/]     -- například: [b]move[ok] 01\n\
Přesun do sousedního uzlu.\n\
\n\
[b]hack[/] [primary]<layer>[/]          -- například: [b]hack[primary] 1\n\
Slouží k hacknutí vrstvy, například ICE vrstvy nebo databáze.\n\
Tohle je hlavní způsob interakce s vrstvami, funguje skoro na všech.\n\
\n\
\n\
Tyto příkazy se používají jen občas:\n
help.inside.scan = [b]scan[/]\n\
Proskenuje a odhalí nové uzly, jakmile je hacknuté ICE.\n
help.inside.password-dc = [b]password[/] [primary]<layer>[/]      -- například: [b]password[primary] 1\n\
Otevře rozhraní pro zadání hesla k ICE.\n\
\n\
[b]dc\n\
Odpojí tě od sítě a ukončí útok. Můžeš také kliknout na 'Home' v menu dole.\n
help.inside.shortcuts-hint = Informace o klávesových zkratkách zobrazíš příkazem: [b]help[/] [b]shortcuts[/]\n
help.keys = Klávesové zkratky terminálu:\n\
\n\
Šipka nahoru a dolů: procházení předchozích příkazů.\n\
Ctrl-L: vyčistí terminál.\n
help.run-script = [b]run[/] [primary]<script code>[/]      -- například: [b]run [primary]1234-abcd\n\
Spustí skript, který máš načtený v paměti.\n
help.weaken = [b]weaken[/] [primary]<layer>[/]      -- například: [b]weaken [primary]1\n\
Sníží sílu ICE vrstvy.\n\
\n\
[b]weaken\n\
Zobrazí, kolik použití weaken ti zbývá.\n
help.rollback = [b]rollback[/]\n\
Vrátí tě do předchozího uzlu a zruší všechny časovače, které jsi spustil vstupem do aktuálního uzlu. Nefunguje, pokud jsi v aktuálním uzlu žádné časovače nespustil.\n
help.jump = [b]jump[/] [info]<user name> -- například: [b]jump [info]angler\n\
Přeskočí do uzlu jiného hackera. ICE tento přesun neblokuje.\n
help.download-script = [b]/download-script[/] [primary]<script code>[/] - stáhne skript.\n\
Skript můžeš stáhnout od jiného hackera, který ho nabídl, nebo si ho od někoho koupit.\n
help.share = [b]/share[/] [info]<user name>[/] (volitelně více jmen)\n\
Nasdílí tvůj běh jednomu nebo více hackerům, aby se k tobě mohli připojit.\n

